hydra:
  run:
    dir: ckpts/${model.name}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 666  # run-level reproducibility: seeds python/torch/cuda and dataset shuffling

datasets:
  name: LibriTTS_100  # data/LibriTTS_100 (wav-only, 53.7 h)
  batch_size_per_gpu: 12000  # frames @100Hz -> 120 s of audio per step, single GPU
  batch_size_type: frame  # frame | sample
  max_samples: 32  # max sequences per batch if use frame-wise batch_size
  num_workers: 8

optim:
  epochs: 100
  learning_rate: 2.0e-4
  num_warmup_updates: 500
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False
  # same shape as WavTTS.yaml, compressed to the small run's 500-update warmup
  rpe_curriculum: [[0, 1.0], [1000, 1.25], [2000, 1.5], [3000, 2.0]]

model:
  name: WavTTS_Uncond_Small  # model name
  backbone: DiT
  cfm:
    prediction: x_pred         # flow | x_pred
    loss_space: v         # flow | v   (v is typical for x_pred mode)
    t_sampling: logistic_normal      # uniform | logistic_normal
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.05
    sample_rate: 16000
    state_null_prob: 0.5    # prob a sample is labelled null; the rest are clean
    p_mix: 0.5              # among null samples, prob of the mixing augmentation, so
                            # p_null = 0.5*p_clean + 0.5*p_mixed. Any p_mix < 1 keeps
                            # CFG self-extinguishing in the clean region; p_mix sets
                            # how deep into it the guidance survives
    p_concat: 0.5           # among mixed: concat (temporal switch) vs overlap
    mix_lambda_range: [0.3, 0.7]
    concat_point_range: [0.3, 0.7]
    concat_xfade_ms: 20
  arch:
    dim: 384
    depth: 8
    heads: 6
    dropout: 0.0
    ff_mult: 4
    qk_norm: null  # null | rms_norm
    pe_attn_head: null
    attn_backend: torch  # torch | flash_attn
    attn_mask_enabled: False
    checkpoint_activations: False
    use_audio_proj: True
    audio_proj_dim: 512
    audio_proj_hidden: 384
    # length extrapolation, see WavTTS.yaml for what each knob does
    attn_mode: full
    rope_type: yarn
    yarn_scale: 2.0
    yarn_native_ctx: 3000
    yarn_alpha: 1.0
    yarn_beta: 32.0
    rpe: relative
    rpe_length_scale: 1.0
    rpe_per_sample: True   # independent draw per sample (reference impl); False is one draw per batch
    logn_ref_len: 500        # see WavTTS.yaml
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 160    # 160 @16k = 100Hz
    target_rms: 0.1       # per-utterance loudness normalization at load time; 0 disables

ckpts:
  logger: tensorboard  # wandb | tensorboard | null
  log_per_updates: 50  # scalar (loss/lr) logging interval in updates
  log_samples: True  # generate fixed-seed samples per save checkpoint (audio + mel + metrics to tensorboard)
  log_samples_seeds: [0, 1, 2, 3]  # same seeds every checkpoint, clips comparable across training
  log_samples_secs: [4, 10, 20, 40]  # one length per seed; see WavTTS.yaml
  spk_ckpt_path: null  # ECAPA (wavlm_large) ckpt for gen/spk_sim_self; null disables the metric
  save_per_updates: 5000  # numbered checkpoint
  keep_last_n_checkpoints: 2
  last_per_updates: 2000  # model_last.pt + fixed-seed samples/mel/metrics ride on this interval
  exp_name: ${model.name}_${datasets.name}
  save_dir: ckpts/${model.name}_${datasets.name}
