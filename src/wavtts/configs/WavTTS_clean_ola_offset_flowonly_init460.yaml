# WavTTS_clean_ola_offset.yaml with the auxiliary mel loss weighted to zero: the
# objective is the flow term alone. Framing, augmentation, data, architecture, LR and
# epoch budget are all unchanged, and the run starts from the weights that arm reached at
# update 252500 rather than from noise. What it measures is what the mel term is still
# contributing to the overlapping arm at that point — not whether the arm can be trained
# without it from cold, which is a different experiment these weights cannot stand in for.
#
# The mel module stays built and only its weight goes to zero. MelSpectrogramLoss returns
# total_loss * weight, so the term contributes exactly zero gradient and logs as a flat 0,
# while its 14 registered buffers (7 STFT windows + 7 mel filterbanks) stay in the state
# dict — which keeps this arm's checkpoints key-compatible with every other arm in both
# directions. The price is that the mel loss is still computed every step, forward and
# backward, for no gradient: about 5% of step time, measured on the non-overlapping arm.
#
# flow_loss IS comparable against the source arm — same target, same space, and the source
# logs it as its own scalar. total loss is not: one has the mel term in it.
#
# The init is weights only. make_pretrained_init.py strips the checkpoint to its EMA and
# zeroes the EMA step, so optimizer, LR schedule and update counter all start at zero,
# warmup included. Prepare it with:
#   python scripts/make_pretrained_init.py \
#     ckpts/WavTTS_Uncond_Large_RPE_Clean_OLA_Offset_LibriTTS_460/model_last.pt \
#     ckpts/WavTTS_Uncond_Large_RPE_Clean_OLA_Offset_FlowOnly_Init460_LibriTTS_460
# No config argument: nothing is reshaped and nothing is dropped, so the state dict loads
# key-for-key.
#
# Two GPUs, not four — the other cards are in use. The update is held at 19200 tokens by
# accumulating instead: 2 ranks x 3 accumulation steps x 3200 tokens. Launch:
#   CUDA_VISIBLE_DEVICES=2,3 NUM_PROCESSES=2 \
#     scripts/train_loop.sh WavTTS_clean_ola_offset_flowonly_init460.yaml
# Both variables matter. Without them the supervisor takes four processes on whatever
# cards are visible, which is a different update size and someone else's GPU.

hydra:
  run:
    dir: ckpts/${model.name}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 666  # run-level reproducibility: seeds python/torch/cuda and dataset shuffling

datasets:
  name: LibriTTS_460  # prepared data dir under data/: clean-100 + clean-360, 149510 clips,
                      # 244.6 h. The arrow also carries a text column; nothing reads it, this
                      # model is unconditional
  batch_size_per_gpu: 3200  # 2 x RTX 4090 (24 GB), bf16 + activation checkpointing. Each
                            # rank pulls its own batch (accelerate's split_batches=False) and
                            # accumulates 3, so 2 x 3 x 3200 is the same 19200-token update every
                            # other arm runs. Half the cards, so roughly half the throughput. The
                            # budget is in model tokens, and CustomDataset.get_frame_len divides
                            # duration by the hop, which is 160 here as in the non-overlapping arm
  batch_size_type: frame  # frame | sample
  max_samples: 384  # the frame budget is the binding cap, as in the non-overlapping arm
  num_workers: 16  # per process; 2 x 16 = 32 = the machine's core count

optim:
  epochs: 177  # batching follows the hop, so this matches the non-overlapping arm at the same
               # budget: 5540 updates per epoch at 3200 tokens, 981k updates over the run. The
               # smaller the budget the worse it packs against long clips, which is why this is
               # above the 5151 of a 4800 budget and the 4705 of a 19200 one — same audio, more
               # padding. The LR decay horizon is derived from this, so changing it rescales the
               # whole schedule
  learning_rate: 7.5e-5
  num_warmup_updates: 20000  # warmup updates
  grad_accumulation_steps: 3  # 2 ranks x 3 x 3200 = 19200 tokens/update
  max_grad_norm: 1.0  # gradient clipping
  bnb_optimizer: False  # use bnb 8bit AdamW optimizer or not (saves ~4 GiB of optimizer state)

model:
  name: WavTTS_Uncond_Large_RPE_Clean_OLA_Offset_FlowOnly_Init460  # model name; FlowOnly =
    # mel term at zero weight, Init460 = started from the OLA_Offset LibriTTS_460 run's weights
  backbone: DiT
  cfm:
    prediction: x_pred         # flow | x_pred
    loss_space: v         # flow | v   (v is typical for x_pred mode)
    t_sampling: logistic_normal      # uniform | logistic_normal
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 1.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.0  # the one thing this arm changes. Zero weight, module kept —
                              # see the header for why that is not the same as switching
                              # use_aux_mel_loss off
    sample_rate: 16000
    state_null_prob: 0.0    # no null label: pure clean training, no CFG. This also
                            # disables the mixing augmentation (only null samples mix),
                            # so p_mix / p_concat / mix_* are left at their defaults and
                            # never reached
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    qk_norm: null  # null | rms_norm
    attn_mask_enabled: True   # keep padded keys out of the softmax; broadcast [b,1,1,n] mask
    checkpoint_activations: True  # recompute activations rather than store them; kept on from
                                  # the single-GPU sizing so the memory headroom is unchanged
    use_audio_proj: True
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    # length extrapolation — randomized positional encoding (Ruoss et al. 2023), see
    # wavtts/model/rope.py. Training data tops out at 2979 tokens (29.8 s), so gamma=4
    # puts the longest clip's positions out to 11916 (119 s). Generating up to that
    # length therefore uses positions the model trained on, with no inference-time
    # knob: vanilla RoPE at base=10000 has its slowest dim turning once every 471 s,
    # so nothing wraps. Reaching past 119 s means raising gamma and retraining.
    rpe_gamma: 4.0           # per-sample stretch bound: L_t ~ U[n, n*gamma], drawn fresh
                             # every forward. gamma=1 disables. Not a curriculum: every
                             # batch spans contiguous through 4x from the first update
    logn_ref_len: 500        # entropy-invariant scaling reference, clamped at 1 so it only
                             # sharpens: 1.0 up to 5 s, 1.29 at 30 s, 1.51 at 120 s. The
                             # token rate is unchanged, so this is unchanged. This is the
                             # only attention temperature in the model
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 320    # window length; 320 @16k = 20 ms of audio per token, twice the
                          # non-overlapping arm's, and it sets the model's input and
                          # output width
    wav_frame_hop: 160    # framing stride, and what the token rate is actually set by:
                          # 160 @16k = 100 Hz, the same rate the non-overlapping arm runs.
                          # Must divide wav_frame_len; equal to it (the default when
                          # omitted) is the old end-to-end reshape framing. At half the
                          # frame it is 50% overlap, so every output sample is the
                          # Hann-weighted mean of two tokens' predictions
    target_rms: 1.0       # per-utterance loudness normalization at load time; 0 disables.
    random_frame_offset: True  # framing-phase augmentation: crop a random 0..wav_frame_hop-1
                               # samples off the front of every clip at load time, so the frame
                               # grid lands somewhere different each epoch. Training only — the
                               # dataset is the only thing that reads it — and it costs at most
                               # 9.9 ms off the head of a clip. Cropping, not zero-padding, so
                               # the token count can only shrink and the sampler's frame budget
                               # stays an upper bound

ckpts:
  logger: tensorboard  # wandb | tensorboard | null
  log_per_updates: 100  # scalar (loss/lr) logging interval in updates
  log_samples: True  # generate fixed-seed samples per save checkpoint (audio + mel + metrics to tensorboard)
  log_samples_seeds: [0, 1, 2, 3]  # same seeds every checkpoint, clips comparable across training
  # one length per seed, fixed across checkpoints. 5s is the bulk of the data, 15s the
  # p95, 30s the training maximum, and 60s is the first genuine length extrapolation.
  # 60s sits inside the position range gamma=4 trains on (119 s), so it tests the model
  # rather than the encoding. Past 119 s is untrained positions either way.
  log_samples_secs: [5, 15, 30, 60]
  spk_ckpt_path: null  # ECAPA (wavlm_large) ckpt for gen/spk_sim_self; null disables the metric
  save_per_updates: 10000  # numbered checkpoint every ~3.5 h on one 4090
  keep_last_n_checkpoints: 5  # -1 to keep all, 0 to not save intermediate, > 0 to keep last N checkpoints
  last_per_updates: 2500  # model_last.pt + fixed-seed samples/mel/metrics ride on this interval
  exp_name: ${model.name}_${datasets.name}
  save_dir: ckpts/${model.name}_${datasets.name}
