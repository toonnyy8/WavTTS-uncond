# Overlapping-frames arm of WavTTS_clean.yaml. The waveform front end slices frames at a
# hop of half a frame instead of butting them end to end, and the output is reassembled by
# overlap-add under a Hann window (see DiT._wav_to_tokens / _tokens_to_wav). Every sample
# is then predicted by two tokens and blended, so a frame boundary is a crossfade rather
# than a splice — the buzz at the 100 Hz frame rate is what this is aimed at.
#
# Everything else matches WavTTS_clean.yaml: no CFG, clean-460, same architecture and
# optimizer. The two knobs below that do change are consequences of the token rate
# doubling to 200 Hz, not independent choices — see logn_ref_len and epochs.
#
# The cost: a token is now half a frame of new audio, so a 19200-token batch carries
# ~91 s of audio instead of ~187 s. At a matched update budget this arm sees half the
# audio the non-overlapping arm does. Matching audio instead would need a 38400-token
# batch, which does not fit in 24 GB.
#
# Launch with bf16:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   accelerate launch --mixed_precision bf16 src/wavtts/train/train.py --config-name WavTTS_clean_ola.yaml

hydra:
  run:
    dir: ckpts/${model.name}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 666  # run-level reproducibility: seeds python/torch/cuda and dataset shuffling

datasets:
  name: LibriTTS_460  # prepared data dir under data/: clean-100 + clean-360, 149510 clips,
                      # 244.6 h. The arrow also carries a text column; nothing reads it, this
                      # model is unconditional
  batch_size_per_gpu: 19200  # single 24 GB GPU (RTX 4090) w/ bf16 + activation checkpointing.
                             # This budget is in model tokens, and CustomDataset.get_frame_len
                             # divides duration by the hop, so the same number still means the
                             # same memory — it just buys half as much audio at hop 80
  batch_size_type: frame  # frame | sample
  max_samples: 384  # not binding at this token rate (mean 15.5 sequences per batch); kept
                    # equal to the non-overlapping arm so the two configs differ in one place
  num_workers: 16

optim:
  epochs: 86  # at 200 Hz a 19200-token batch holds half as many clips, so an epoch is
              # 9673 updates instead of 4705. 86 epochs is 832k updates — the same update
              # budget the non-overlapping arm runs, which is what keeps the two comparable
              # on compute. It is 86 passes over the data rather than 177, and the LR decay
              # horizon is derived from it, so changing it rescales the whole schedule
  learning_rate: 7.5e-5
  num_warmup_updates: 20000  # warmup updates
  grad_accumulation_steps: 1  # 1 x 19200 = 19200 frames/update, via activation checkpointing
  max_grad_norm: 1.0  # gradient clipping
  bnb_optimizer: False  # use bnb 8bit AdamW optimizer or not (saves ~4 GiB of optimizer state)

model:
  name: WavTTS_Uncond_Large_RPE_Clean_OLA  # model name
  backbone: DiT
  cfm:
    prediction: x_pred         # flow | x_pred
    loss_space: v         # flow | v   (v is typical for x_pred mode)
    t_sampling: logistic_normal      # uniform | logistic_normal
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 1.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.05
    sample_rate: 16000
    state_null_prob: 0.0    # no null label: pure clean training, no CFG. This also
                            # disables the mixing augmentation (only null samples mix),
                            # so p_mix / p_concat / mix_* are left at their defaults and
                            # never reached
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    qk_norm: null  # null | rms_norm
    attn_mask_enabled: True   # keep padded keys out of the softmax; broadcast [b,1,1,n] mask
    checkpoint_activations: True  # recompute activations so the full 19200-frame update fits
                                  # in one batch, trading ~30% step time for no accumulation
    use_audio_proj: True
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    # length extrapolation — randomized positional encoding (Ruoss et al. 2023), see
    # wavtts/model/rope.py. Training data tops out at 5958 tokens (29.8 s at 200 Hz), so
    # gamma=4 puts the longest clip's positions out to 23832, still 119 s — the physical
    # span is unchanged, only the token count doubled. Nothing wraps either: at 200 Hz
    # the slowest RoPE dim at base=10000 turns once every 235 s, still past 119 s.
    # Reaching past 119 s means raising gamma and retraining.
    rpe_gamma: 4.0           # per-sample stretch bound: L_t ~ U[n, n*gamma], drawn fresh
                             # every forward. gamma=1 disables. Not a curriculum: every
                             # batch spans contiguous through 4x from the first update
    logn_ref_len: 1000       # entropy-invariant scaling reference, clamped at 1 so it only
                             # sharpens. Doubled with the token rate: 1000 tokens at 200 Hz
                             # is the same 5 s the non-overlapping arm's 500 was, so the
                             # temperature curve stays put in seconds. This is the only
                             # attention temperature in the model
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 160    # window length; 160 @16k = 10 ms of audio per token
    wav_frame_hop: 80     # framing stride. Must divide wav_frame_len; equal to it (the
                          # default when omitted) is the old end-to-end reshape framing.
                          # 80 is 50% overlap, so the token rate is 200 Hz and each output
                          # sample is the Hann-weighted mean of two tokens' predictions
    target_rms: 1.0       # per-utterance loudness normalization at load time; 0 disables.

ckpts:
  logger: tensorboard  # wandb | tensorboard | null
  log_per_updates: 100  # scalar (loss/lr) logging interval in updates
  log_samples: True  # generate fixed-seed samples per save checkpoint (audio + mel + metrics to tensorboard)
  log_samples_seeds: [0, 1, 2, 3]  # same seeds every checkpoint, clips comparable across training
  # one length per seed, fixed across checkpoints. 5s is the bulk of the data, 15s the
  # p95, 30s the training maximum, and 60s is the first genuine length extrapolation.
  # 60s sits inside the position range gamma=4 trains on (119 s), so it tests the model
  # rather than the encoding. Past 119 s is untrained positions either way.
  log_samples_secs: [5, 15, 30, 60]
  spk_ckpt_path: null  # ECAPA (wavlm_large) ckpt for gen/spk_sim_self; null disables the metric
  save_per_updates: 10000  # numbered checkpoint every ~3.5 h on one 4090
  keep_last_n_checkpoints: 5  # -1 to keep all, 0 to not save intermediate, > 0 to keep last N checkpoints
  last_per_updates: 2500  # model_last.pt + fixed-seed samples/mel/metrics ride on this interval
  exp_name: ${model.name}_${datasets.name}
  save_dir: ckpts/${model.name}_${datasets.name}
