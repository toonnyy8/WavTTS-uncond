# Length-extrapolation experiment: Randomized YaRN + entropy invariance.
# model.name differs from the baseline run so checkpoints and TB logs stay separate —
# the two are not resume-compatible (vanilla RoPE stores rotary_embed.inv_freq, YaRN does not).
#
# Launch with bf16 — fp32 only fits 2400 frames/GPU on 24 GB:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   accelerate launch --mixed_precision bf16 src/wavtts/train/train.py --config-name WavTTS.yaml

hydra:
  run:
    dir: ckpts/${model.name}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 666  # run-level reproducibility: seeds python/torch/cuda and dataset shuffling

datasets:
  name: LibriTTS_100  # prepared data dir name under data/ (wav-only, 53.7 h)
  batch_size_per_gpu: 3200  # single 24 GB GPU (RTX 4090) w/ bf16, no activation checkpointing
  batch_size_type: frame  # frame | sample
  max_samples: 64  # max sequences per batch if use frame-wise batch_size. we set 32 for small models, 64 for base models
  num_workers: 16

optim:
  epochs: 686
  learning_rate: 7.5e-5
  num_warmup_updates: 20000  # warmup updates
  grad_accumulation_steps: 6  # 6 x 3200 = 19200 frames/update; cheaper than activation checkpointing here
  max_grad_norm: 1.0  # gradient clipping
  bnb_optimizer: False  # use bnb 8bit AdamW optimizer or not (saves ~4 GiB of optimizer state)
  # RPE length curriculum: [update, k]. k=1.0 is contiguous positions, so the model
  # learns ordinary speech first and only then meets stretched ones. Held at 1.0
  # through the 20k warmup; the paper's ablation shows the ramp itself is what works.
  rpe_curriculum: [[0, 1.0], [20000, 1.25], [40000, 1.5], [60000, 2.0]]

model:
  name: WavTTS_Uncond_Large_YaRN  # model name
  backbone: DiT
  cfm:
    prediction: x_pred         # flow | x_pred
    loss_space: v         # flow | v   (v is typical for x_pred mode)
    t_sampling: logistic_normal      # uniform | logistic_normal
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.05
    sample_rate: 16000
    p_mix: 0.5              # prob a sample becomes a "mixed" negative
    p_concat: 0.5           # among mixed: concat (temporal switch) vs overlap
    mix_lambda_range: [0.3, 0.7]
    concat_point_range: [0.3, 0.7]
    concat_xfade_ms: 20
    state_drop_prob: 0.1    # drop state label to null
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    qk_norm: null  # null | rms_norm
    pe_attn_head: null
    attn_backend: torch  # torch | flash_attn
    attn_mask_enabled: False
    checkpoint_activations: False  # recompute activations and save memory for extra compute
    use_audio_proj: True
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    # length extrapolation — Randomized YaRN (arXiv:2606.23687) + entropy invariance.
    # Training data tops out at 2979 frames (29.8 s); s=2 trains the YaRN spectrum for
    # 60 s and inference at s'=4 reaches 120 s. rope_type: default disables all of it.
    rope_type: yarn          # default | yarn
    yarn_scale: 2.0          # s during training; set s' at inference
    yarn_native_ctx: 3000    # frames (30 s) the architecture should cover unaided
    yarn_alpha: 1.0          # dims turning < alpha times over native_ctx: full interpolation
    yarn_beta: 32.0          # dims turning > beta times: pure extrapolation
    rpe: relative            # off | relative (L_t = k * clip length) | absolute (k * native_ctx)
    rpe_length_scale: 1.0    # initial k; optim.rpe_curriculum advances it
    rpe_per_sample: True     # independent draw per sample (reference impl); False is one draw per batch
    logn_ref_len: 3000       # entropy-invariant attention scaling reference; null disables
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 160    # 160 @16k = 100Hz
    target_rms: 0.1       # per-utterance loudness normalization at load time; 0 disables

ckpts:
  logger: tensorboard  # wandb | tensorboard | null
  log_per_updates: 100  # scalar (loss/lr) logging interval in updates
  log_samples: True  # generate fixed-seed samples per save checkpoint (audio + mel + metrics to tensorboard)
  log_samples_seeds: [0, 1, 2, 3]  # same seeds every checkpoint, clips comparable across training
  log_samples_sec: 5  # fixed clip length in seconds
  spk_ckpt_path: null  # ECAPA (wavlm_large) ckpt for gen/spk_sim_self; null disables the metric
  save_per_updates: 10000  # numbered checkpoint every ~3.5 h on one 4090
  keep_last_n_checkpoints: 5  # -1 to keep all, 0 to not save intermediate, > 0 to keep last N checkpoints
  last_per_updates: 2500  # model_last.pt + fixed-seed samples/mel/metrics ride on this interval
  exp_name: ${model.name}_${datasets.name}
  save_dir: ckpts/${model.name}_${datasets.name}
