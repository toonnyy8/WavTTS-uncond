# WavTTS_clean_ola_offset.yaml with randomized positional encoding turned off, started
# from the weights that arm reached at update 252500. Framing, augmentation, data, loss,
# architecture, LR and epoch budget are all unchanged; rpe_gamma goes 4.0 -> 1.0 and
# nothing else does.
#
# The question: RPE buys length extrapolation, but does it cost quality inside the
# training range? At gamma=4 every forward tells a clip it spans up to four times the
# stretch it really does, so the model never sees the position spacing it will actually
# be generating at. This arm removes that and watches what happens to the samples.
#
# Where to look. log_samples_secs already spans 5/15/30/60 s and the split is exactly the
# trade: 5-30 s sits inside the training range, where this arm should win if the
# hypothesis holds, and 60 s is past the 30 s training maximum, where it should lose —
# contiguous positions mean 60 s of audio now lands on positions no update ever visited.
# A result where the short lengths improve and 60 s degrades IS the hypothesis confirmed,
# not a failure.
#
# Read the warm start honestly. These weights spent 252500 updates being shaped under
# gamma=4, and they keep whatever that did to them. So this measures what removing the
# augmentation does to a model already built by it — not what a model trained on
# contiguous positions from scratch would look like, which is a different and more
# expensive experiment this one cannot stand in for.
#
# The init is weights only. make_pretrained_init.py strips the checkpoint to its EMA and
# zeroes the EMA step, so optimizer, LR schedule and update counter all start at zero,
# warmup included. Prepare it with:
#   python scripts/make_pretrained_init.py \
#     ckpts/WavTTS_Uncond_Large_RPE_Clean_OLA_Offset_LibriTTS_460/model_last.pt \
#     ckpts/WavTTS_Uncond_Large_RPE_Clean_OLA_Offset_Gamma1_Init460_LibriTTS_460
# No config argument: rpe_gamma changes no tensor shape and drops no module, so the state
# dict loads key-for-key. (rope.py builds its frequencies on the fly; nothing about the
# positional encoding is stored in the checkpoint.)
#
# One GPU, and the update is held at 19200 tokens by accumulating six times. Launch:
#   CUDA_VISIBLE_DEVICES=2 NUM_PROCESSES=1 \
#     scripts/train_loop.sh WavTTS_clean_ola_offset_gamma1_init460.yaml
# Both variables matter. Without them the supervisor takes four processes on whatever
# cards are visible, which is a different update size and someone else's GPU.

hydra:
  run:
    dir: ckpts/${model.name}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 666  # run-level reproducibility: seeds python/torch/cuda and dataset shuffling

datasets:
  name: LibriTTS_460  # prepared data dir under data/: clean-100 + clean-360, 149510 clips,
                      # 244.6 h. The arrow also carries a text column; nothing reads it, this
                      # model is unconditional
  batch_size_per_gpu: 3200  # 1 x RTX 4090 (24 GB), bf16 + activation checkpointing. A single
                            # rank accumulating 6 micro-batches, so 6 x 3200 is the same
                            # 19200-token update every other arm runs — no data parallelism, the
                            # six passes are sequential. The budget is in model tokens, and
                            # CustomDataset.get_frame_len divides duration by the hop, which is
                            # 160 here as in the non-overlapping arm: same tokens, same audio
  batch_size_type: frame  # frame | sample
  max_samples: 384  # the frame budget is the binding cap, as in the non-overlapping arm
  num_workers: 16  # one process, so 16 of the machine's 32 cores feed it

optim:
  epochs: 177  # batching follows the budget, not the gpu count: 5540 updates per epoch at
               # 3200 tokens, 981k updates over the run, the same as the two-gpu arms at the
               # same budget. Smaller budgets pack worse against long clips, which is why this
               # is above the 5151 of a 4800 budget and the 4705 of a 19200 one — same audio,
               # more padding. On one card this is ~0.7 updates/s, so the full 177 epochs is
               # over two weeks. The LR decay horizon is derived from this, so changing it
               # rescales the whole schedule
  learning_rate: 7.5e-5
  num_warmup_updates: 20000  # warmup updates
  grad_accumulation_steps: 6  # 1 rank x 6 x 3200 = 19200 tokens/update
  max_grad_norm: 1.0  # gradient clipping
  bnb_optimizer: False  # use bnb 8bit AdamW optimizer or not (saves ~4 GiB of optimizer state)

model:
  name: WavTTS_Uncond_Large_RPE_Clean_OLA_Offset_Gamma1_Init460  # model name; the RPE in the
    # family prefix is the module, which is still there — Gamma1 is what says it is disabled
  backbone: DiT
  cfm:
    prediction: x_pred         # flow | x_pred
    loss_space: v         # flow | v   (v is typical for x_pred mode)
    t_sampling: logistic_normal      # uniform | logistic_normal
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 1.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.05
    sample_rate: 16000
    state_null_prob: 0.0    # no null label: pure clean training, no CFG. This also
                            # disables the mixing augmentation (only null samples mix),
                            # so p_mix / p_concat / mix_* are left at their defaults and
                            # never reached
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    qk_norm: null  # null | rms_norm
    attn_mask_enabled: True   # keep padded keys out of the softmax; broadcast [b,1,1,n] mask
    checkpoint_activations: True  # recompute activations rather than store them; kept on from
                                  # the single-GPU sizing so the memory headroom is unchanged
    use_audio_proj: True
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    # length extrapolation, deliberately given up. The other arms run gamma=4, which
    # stretches a clip's positions over up to 4x their real span so that short training
    # audio still exercises the rotations long audio would produce, out to 119 s.
    rpe_gamma: 1.0           # the one thing this arm changes. At 1.0 DiT.forward skips
                             # randomized_positions() entirely and takes the same contiguous
                             # 0..n-1 path inference uses, so training and generation finally
                             # agree on position spacing — that agreement is the hypothesis.
                             # The cost is real: nothing above 30 s is trained on any more
    logn_ref_len: 500        # entropy-invariant scaling reference, clamped at 1 so it only
                             # sharpens: 1.0 up to 5 s, 1.29 at 30 s, 1.51 at 120 s. The
                             # token rate is unchanged, so this is unchanged. This is the
                             # only attention temperature in the model
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 320    # window length; 320 @16k = 20 ms of audio per token, twice the
                          # non-overlapping arm's, and it sets the model's input and
                          # output width
    wav_frame_hop: 160    # framing stride, and what the token rate is actually set by:
                          # 160 @16k = 100 Hz, the same rate the non-overlapping arm runs.
                          # Must divide wav_frame_len; equal to it (the default when
                          # omitted) is the old end-to-end reshape framing. At half the
                          # frame it is 50% overlap, so every output sample is the
                          # Hann-weighted mean of two tokens' predictions
    target_rms: 1.0       # per-utterance loudness normalization at load time; 0 disables.
    random_frame_offset: True  # framing-phase augmentation: crop a random 0..wav_frame_hop-1
                               # samples off the front of every clip at load time, so the frame
                               # grid lands somewhere different each epoch. Training only — the
                               # dataset is the only thing that reads it — and it costs at most
                               # 9.9 ms off the head of a clip. Cropping, not zero-padding, so
                               # the token count can only shrink and the sampler's frame budget
                               # stays an upper bound

ckpts:
  logger: tensorboard  # wandb | tensorboard | null
  log_per_updates: 100  # scalar (loss/lr) logging interval in updates
  log_samples: True  # generate fixed-seed samples per save checkpoint (audio + mel + metrics to tensorboard)
  log_samples_seeds: [0, 1, 2, 3]  # same seeds every checkpoint, clips comparable across training
  # one length per seed, fixed across checkpoints. 5s is the bulk of the data, 15s the
  # p95, 30s the training maximum, and 60s is the first genuine length extrapolation.
  # For THIS arm 60 s is no longer inside any trained position range — gamma=1 trains
  # only on what the clips really span, up to 30 s — so the 60 s sample is the extrapolation
  # this arm is expected to lose, and the 5-30 s ones are where it is expected to gain.
  log_samples_secs: [5, 15, 30, 60]
  spk_ckpt_path: null  # ECAPA (wavlm_large) ckpt for gen/spk_sim_self; null disables the metric
  save_per_updates: 10000  # numbered checkpoint every ~3.5 h on one 4090
  keep_last_n_checkpoints: 5  # -1 to keep all, 0 to not save intermediate, > 0 to keep last N checkpoints
  last_per_updates: 2500  # model_last.pt + fixed-seed samples/mel/metrics ride on this interval
  exp_name: ${model.name}_${datasets.name}
  save_dir: ckpts/${model.name}_${datasets.name}
